# =============================================================================
# Respeaker XVF3800 voice satellite — central device configuration
#
# This is the one file you keep in the ESPHome Device Builder. It holds all
# the standard ESPHome components (esphome, esp32, wifi, logger, api, ota,
# i2c, psram), so you can edit them right in the builder. The XVF3800
# hardware, the voice satellite behavior, and the Pipecat realtime assistant
# come from the packages of this repository.
#
# Before you build this file, put a secrets.yaml next to it. Copy
# secrets.yaml.example to secrets.yaml and set your own values.
# =============================================================================

substitutions:
  name: respeaker-xvf3800-assistant
  friendly_name: reSpeaker XVF3800 Assistant

  # Release of this fork. It selects the YAML packages, the C++ components,
  # and the DFU firmware. Set it to "main" to follow the newest code.
  respeaker_ref: 2026.11.0
  # Release of the voice satellite core (Respeaker-Lite-ESPHome-integration).
  # 2026.11.0 fixes the firmware version formatting with current ESPHome
  # headers. The base package defaults to 2026.10.4; this overrides it.
  respeaker_lite_ref: 2026.11.0

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: formatbce.Respeaker XVF3800 Satellite
    version: 2026.11.0

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .home.arpa
  # Add power management and connection optimizations
  power_save_mode: none  # Disable power saving for better performance
  reboot_timeout: 10min  # Prevent unnecessary reboots
  # CAUTION: a low output power can silently starve the continuous ~256 kbit/s
  # microphone uplink of the Pipecat conversation: control messages still get
  # through, but the server receives no usable audio and every session aborts
  # with "no speech detected". If voice detection stops working, remove this
  # line (or raise it) and test again.
  # output_power: 8.5dB

logger:
  level: INFO
  initial_level: INFO
  logs:
    sensor: WARN
    voice_assistant: INFO
    micro_wake_word: INFO
    i2s_audio: WARN
    respeaker_xvf3800: INFO

api:
  # Required by the va_pipecat auto-provisioning action.
  custom_services: true
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    scan: true
    frequency: 400kHz

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false  # The VPE has PSRAM, so this is safe. Allows configuring WiFi driver to use more resources (done automatically by the speaker media player)

sensor:
  # Link quality diagnostic: the Pipecat microphone uplink is a continuous
  # ~256 kbit/s stream. Below roughly -70 dBm it will starve, and the
  # assistant will hear only fragments. Check this when audio quality or
  # voice detection degrades.
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic

packages:
  respeaker:
    # This fork adds the Pipecat realtime assistant on top of the baseline.
    # Pin a release tag here; "main" follows the newest code.
    url: https://github.com/TheBToby/Respeaker-XVF3800-Pipecat
    ref: ${respeaker_ref}
    refresh: 1d
    files:
      - packages/base.yaml
      - packages/hardware.yaml
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/timers-alarm.yaml
      # pipecat.yaml removes the wake word handler of the core, and
      # pipecat-wake.yaml adds the replacement, so the order matters: wake
      # comes last.
      - packages/pipecat.yaml
      - packages/pipecat-wake.yaml
