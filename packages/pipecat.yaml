# =============================================================================
# Respeaker XVF3800 satellite — Pipecat Assist package
#
# Adds the Pipecat realtime assistant (kyvaith/pipecat-homeassistant) next to
# the Home Assistant Assist pipeline. The "Assistant source" select decides
# which backend the wake word starts. When Pipecat is selected but its
# WebSocket is down, the wake word falls back to the Assist pipeline. The
# wake word handler that does this lives in pipecat-wake.yaml; include that
# file after this one.
#
# Auto connectivity: the Pipecat Assist add-on discovers this device through
# Home Assistant and pushes the authenticated WebSocket endpoint into the
# hidden provision_pipecat native API action every 15 seconds
# ("auto_provision"). Nothing to configure on the device: install the add-on,
# set its satellite secret, and the device reconnects itself after every
# restart. "api: custom_services: true" below is required for that action.
#
# This package removes the wake word handler of the voice satellite core
# ("on_wake_word_detected: !remove"). ESPHome joins trigger lists from all
# packages and cannot remove and re-add one key in a single document, so the
# replacement handler is in pipecat-wake.yaml.
#
# Do not include this file without pipecat-wake.yaml, or the device will not
# react to wake words.
# =============================================================================

substitutions:
  # Release of kyvaith/pipecat-homeassistant that holds the va_pipecat
  # component. Set it to "main" to follow the newest code.
  va_pipecat_ref: v0.2.7
  # Barge-in keeps the microphone open while the assistant speaks (talk-over).
  # "false" (default) gates the microphone off during replies, which keeps
  # room noise and TTS echo out of the pipeline. The "Stop" wake word still
  # interrupts a reply (it runs locally on the wake word channel).
  pipecat_barge_in: "false"
  # Silence watchdog: the conversation closes when the phase stays
  # "listening" and neither the server (no new utterance) nor the microphone
  # envelope (no sound above pipecat_voice_threshold) saw anything for this
  # many seconds. This is the initial value of the "Pipecat silence timeout"
  # number entity; tune it in Home Assistant. Set the entity to 0 to
  # disable the watchdog.
  pipecat_silence_timeout_seconds: "8"
  # Microphone envelope level (normalized 0.0-1.0) above which the watchdog
  # treats the microphone as active and refreshes its silence reference.
  pipecat_voice_threshold: "0.05"
  # Hard budget for one conversation: when a follow-up window opens and the
  # conversation is older than this, it closes instead of listening again.
  # Noise-triggered turns in a loud room re-open the window after every
  # reply; the budget ends that cycle. 0 disables the budget.
  pipecat_conversation_budget_seconds: "30"
  # Minimum time between two handled wake word detections. micro_wake_word
  # keeps running after a detection, and one utterance can fire a second
  # detection ~150 ms later; without the debounce that echo tears down
  # whatever the first detection just started (the wake loop).
  pipecat_wake_debounce_ms: "1000"

globals:
  # millis() timestamp of the last handled wake word detection (debounce).
  - id: pipecat_last_wake_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # millis() timestamp of the first listening entry of the current
  # conversation (the reference for the conversation budget).
  - id: pipecat_conversation_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Phase id of the previous Pipecat phase, so a listening entry knows
  # whether it starts a fresh conversation or re-opens a follow-up window.
  - id: pipecat_prev_phase_id
    type: int
    restore_value: no
    initial_value: '10'
  # Set by the phase mapping when a phase arrives without a wake-driven
  # conversation (server-initiated turn) or when the conversation budget ran
  # out; the phase automation then closes the session. Latched until the
  # next wake-driven listening entry, so trailing phases of an aborted turn
  # do not re-trigger stop after stop.
  - id: pipecat_close_session
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: pipecat_guard_latched
    type: bool
    restore_value: no
    initial_value: 'false'
  # millis() timestamp of the moment the current listening window opened.
  - id: pipecat_window_open_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # millis() timestamp of the last microphone envelope above the voice
  # threshold (on_audio_level), and of the window opening itself. The
  # silence watchdog closes the window when this reference ages past the
  # timeout without a server utterance in between.
  - id: pipecat_last_voice_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # millis() timestamp of the last progress in the conversation: every
  # phase change and every audio envelope above the threshold refreshes it.
  # The session watchdog closes a conversation that stops making progress
  # (e.g. stuck in "follow-up queued until local playback drains" when the
  # final audio tail of a reply stalls mid-delivery).
  - id: pipecat_last_progress_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

external_components:
  - source:
      type: git
      url: https://github.com/kyvaith/pipecat-homeassistant
      ref: ${va_pipecat_ref}
    components:
      - va_pipecat
    refresh: 1d

api:
  # The hidden provision_pipecat action of va_pipecat is a dynamic native API
  # action. The Pipecat Assist add-on calls it to push the endpoint.
  custom_services: true

micro_wake_word:
  # The replacement handler is in pipecat-wake.yaml. Read the file header.
  on_wake_word_detected: !remove

select:
  # Which backend the wake word starts. "Pipecat realtime" talks to a
  # speech-to-speech model over the Pipecat Assist add-on. "Home Assistant
  # Assist" runs the classic HA pipeline of the voice satellite core.
  - platform: template
    name: "Assistant source"
    id: assistant_source
    icon: "mdi:assistant"
    entity_category: config
    optimistic: true
    restore_value: yes
    initial_option: "Pipecat realtime"
    options:
      - "Pipecat realtime"
      - "Home Assistant Assist"

va_pipecat:
  id: pipecat_va
  auto_provision: true
  barge_in: ${pipecat_barge_in}
  microphone:
    # Channel 0 is the DSP "comms" output with AEC and AGC, the same channel
    # the native pipeline uses for STT.
    microphone: i2s_mics
    channels: 0
  # The downlink arrives as PCM16 mono at 24 kHz. The resampler speaker
  # (hardware.yaml) brings it to the mixer, so the assistant mixes with
  # announcements and media.
  speaker: pipecat_resampling_speaker
  on_phase:
    # Map the Pipecat phase onto the voice assistant phase id that drives the
    # LED ring, so the ring behaves the same for both backends. Also tracks
    # fresh-vs-follow-up listening entries and the conversation start time,
    # and decides whether the phase belongs to a wake-driven conversation at
    # all.
    - lambda: |-
        int prev = id(pipecat_prev_phase_id);
        id(pipecat_close_session) = false;
        if (phase == "listening") {
          id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
          // The silence watchdog reference starts at the window opening, and
          // on_audio_level refreshes it while anyone makes a sound.
          id(pipecat_last_voice_ms) = millis();
          id(pipecat_window_open_ms) = millis();
          // After idle (or at boot) this listening entry starts a new
          // conversation and resets its budget; after thinking, speaking, or
          // listening it only re-opens a follow-up window of the same one.
          // A wake-driven entry also clears the guard latch.
          if (prev == ${voice_assist_idle_phase_id} || prev == ${voice_assist_error_phase_id} || prev == ${voice_assist_not_ready_phase_id}) {
            id(pipecat_conversation_start_ms) = millis();
            id(pipecat_guard_latched) = false;
          }
        } else if (phase == "thinking") {
          // The server VAD closed the utterance: release the beam, like the
          // native pipeline does at STT VAD end.
          id(respeaker).unlock_beam();
          id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
        } else if (phase == "speaking") {
          id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
        } else {
          // idle and thanks: the conversation is over. Safety-net beam
          // unlock, idempotent.
          id(respeaker).unlock_beam();
          id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          id(pipecat_conversation_start_ms) = 0;
        }
        id(pipecat_prev_phase_id) = id(voice_assistant_phase);
        // Every phase change is progress for the session watchdog.
        id(pipecat_last_progress_ms) = millis();
        // Wake-gate guard: phases that arrive without a wake-driven
        // conversation are server-initiated (the session memory resumes its
        // context after a reconnect and the model may greet or react to room
        // noise). Abort them once (latched — trailing phases of the aborted
        // turn must not re-trigger stop after stop); the latch clears on the
        // next wake-driven listening entry above.
        if (!id(pipecat_guard_latched) && id(pipecat_conversation_start_ms) == 0 &&
            (phase == "listening" || phase == "thinking" || phase == "speaking")) {
          id(pipecat_guard_latched) = true;
          id(pipecat_close_session) = true;
        }
        // Budget: a follow-up window of a conversation older than the budget
        // closes instead of listening again. Noise-triggered turns re-open
        // windows after every reply; the budget ends that cycle.
        bool follow_up = (phase == "listening") &&
                         (prev == ${voice_assist_listening_for_command_phase_id} || prev == ${voice_assist_thinking_phase_id} || prev == ${voice_assist_replying_phase_id});
        if (follow_up && ${pipecat_conversation_budget_seconds} > 0 &&
            id(pipecat_conversation_start_ms) != 0 &&
            millis() - id(pipecat_conversation_start_ms) > (uint32_t) ${pipecat_conversation_budget_seconds} * 1000) {
          id(pipecat_close_session) = true;
        }
    - if:
        condition:
          lambda: 'return id(pipecat_close_session);'
        then:
          - logger.log:
              level: INFO
              format: "Pipecat: closing a conversation that no wake word started or whose budget ran out"
          - va_pipecat.stop: pipecat_va
    # Duck music while the conversation runs, the same way the native
    # pipeline ducks on start. Pipecat speaks through its own mixer input,
    # so the duck does not lower the assistant itself.
    - if:
        condition:
          lambda: 'return phase == "listening" || phase == "thinking" || phase == "speaking";'
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 20
              duration: 0.0s
        else:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    # Scale the assistant output to the media player volume at the start of
    # every turn, so the volume of announcements and of the assistant match.
    - if:
        condition:
          lambda: 'return phase == "listening";'
        then:
          - va_pipecat.set_volume:
              id: pipecat_va
              volume: !lambda return id(external_media_player).volume;
    # Enable the internal "stop" wake word for the whole conversation, so
    # "Stop" interrupts a reply or closes the window (see the wake word
    # handler). While a timer or the alarm rings, timers-alarm.yaml owns the
    # model. The "Stop word" switch disables the feature entirely.
    - if:
        condition:
          and:
            - switch.is_on: stop_word_enabled
            - switch.is_off: timer_ringing
            - lambda: 'return phase == "listening" || phase == "thinking" || phase == "speaking";'
        then:
          - micro_wake_word.enable_model: stop
    - if:
        condition:
          and:
            - switch.is_off: timer_ringing
            - lambda: 'return !(phase == "listening" || phase == "thinking" || phase == "speaking");'
        then:
          - micro_wake_word.disable_model: stop
    - text_sensor.template.publish:
        id: pipecat_phase
        state: !lambda return phase;
    - script.execute: control_leds
  on_transcript:
    - logger.log:
        level: INFO
        format: "Pipecat %s: %s"
        args: [role.c_str(), text.c_str()]
  on_audio_level:
    # Sound above the threshold refreshes the watchdog references, so a
    # command in progress is never cut off mid-sentence and a playing reply
    # is never closed while it is audible.
    - if:
        condition:
          lambda: 'return input_level > ${pipecat_voice_threshold} || output_level > ${pipecat_voice_threshold};'
        then:
          - lambda: |-
              id(pipecat_last_voice_ms) = millis();
              id(pipecat_last_progress_ms) = millis();
  on_error:
    - logger.log:
        level: WARN
        format: "Pipecat error %s: %s"
        args: [code.c_str(), message.c_str()]
    - lambda: |-
        id(respeaker).unlock_beam();
        id(voice_assistant_phase) = ${voice_assist_error_phase_id};
    - script.execute: control_leds
  on_repeated_failure:
    - logger.log:
        level: WARN
        format: "Pipecat keeps failing to connect. Wake words use the Assist pipeline until it is back."
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

text_sensor:
  - platform: template
    id: pipecat_phase
    name: "Pipecat phase"
    icon: "mdi:state-machine"
    entity_category: diagnostic
    update_interval: never

binary_sensor:
  - platform: template
    id: pipecat_connected
    name: "Pipecat connected"
    icon: "mdi:connection"
    entity_category: diagnostic
    lambda: return id(pipecat_va).is_connected();

button:
  - platform: template
    name: "Stop Pipecat conversation"
    id: stop_pipecat_conversation
    icon: "mdi:stop-circle"
    entity_category: config
    on_press:
      - va_pipecat.stop: pipecat_va

switch:
  # Gates the internal "stop" wake word. While it is on, "Stop" interrupts a
  # Pipecat reply or closes an open conversation window (see the wake word
  # handler in pipecat-wake.yaml). Turn it off to disable the stop word.
  - platform: template
    name: "Stop word"
    id: stop_word_enabled
    icon: "mdi:stop-circle-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

number:
  # Initial silence timeout of the conversation watchdog (see the script
  # below). Tunable at runtime in Home Assistant; 0 disables the watchdog.
  - platform: template
    name: "Pipecat silence timeout"
    id: pipecat_silence_timeout
    icon: "mdi:timer-outline"
    entity_category: config
    unit_of_measurement: "s"
    min_value: 0
    max_value: 60
    step: 1
    optimistic: true
    restore_value: true
    initial_value: ${pipecat_silence_timeout_seconds}

interval:
  # Session watchdog, checked once a second. While a Pipecat conversation is
  # active (listening, thinking, or speaking) it closes the session when it
  # stops making progress: no new utterance from the server AND no audio
  # envelope above pipecat_voice_threshold for the timeout. This catches
  # sessions that hang in "follow-up queued until local playback drains"
  # when the final audio tail of a reply stalls mid-delivery, and aborts
  # wake words nobody spoke. Thinking gets three times the timeout, because
  # slow Home Assistant tool calls are normal. The "Pipecat silence timeout"
  # number entity holds the seconds; 0 disables the watchdog.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (id(pipecat_silence_timeout).state <= 0 || !id(pipecat_va).is_connected()) {
                return false;
              }
              int p = id(voice_assistant_phase);
              bool active = (p == ${voice_assist_listening_for_command_phase_id} || p == ${voice_assist_thinking_phase_id} || p == ${voice_assist_replying_phase_id});
              if (!active) {
                return false;
              }
              uint32_t limit = (uint32_t) id(pipecat_silence_timeout).state * 1000 * (p == ${voice_assist_thinking_phase_id} ? 3 : 1);
              return (millis() - id(pipecat_last_voice_ms) > limit) && (millis() - id(pipecat_last_progress_ms) > limit);
          then:
            - logger.log:
                level: INFO
                format: "Pipecat: no progress for %u s, closing the conversation"
                args: ['(unsigned) id(pipecat_silence_timeout).state']
            - va_pipecat.stop: pipecat_va
      # A stray native pipeline (Home Assistant can start one around a wake
      # word event) would stream the microphone to two backends at once.
      # While a Pipecat session is connected, stop it within a second. When
      # Pipecat is disconnected, the fallback pipeline runs legitimately and
      # is left alone.
      - if:
          condition:
            and:
              - lambda: 'return id(assistant_source).current_option() == "Pipecat realtime";'
              - lambda: 'return id(pipecat_va).is_connected();'
              - voice_assistant.is_running:
          then:
            - logger.log:
                level: INFO
                format: "Pipecat: stopping the stray native voice assistant"
            - voice_assistant.stop: